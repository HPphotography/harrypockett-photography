<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Optional clean background to frame the serif monogram -->
  <rect width="512" height="512" fill="#1a1a18" rx="100"/>
  
  <!-- "HP" Monogram rendered in an elegant, high-contrast serif structure -->
  <text x="50%" y="62%" 
        font-family="'Cormorant Garamond', 'Georgia', serif" 
        font-size="280" 
        font-weight="300" 
        fill="#d1b46a" 
        letter-spacing="-0.03em"
        text-anchor="middle" 
        dominant-baseline="middle">HP</text>
</svg>
